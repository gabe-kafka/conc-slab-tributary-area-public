services:
  - type: web
    name: tributary-plate-slab
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TRIBUTARY_APP_DATA
        value: /tmp/tributary-data
    plan: free
