<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Two-Way Slab Tributary Area{% endblock %}</title>
    <link rel="stylesheet" href="/static/site.css?v=20260315c" />
  </head>
  <body class="page-{{ page or 'default' }}">
    <div class="app-shell">
      <header class="status-bar">
        <div class="status-left">
          <span class="status-chip">LOCAL V1</span>
          <span class="status-chip">TRIBUTARY AREA</span>
          <span class="status-chip">ROUTE {{ (page or 'default')|upper }}</span>
        </div>
        <div class="status-right">
          <span class="status-chip">CONN OK</span>
          <span class="status-chip" id="status-clock">--:--:--</span>
        </div>
      </header>

      <nav class="top-nav">
        <div class="top-nav-links">
          <a href="/" class="{% if page == 'index' %}active{% endif %}">UPLOAD</a>
        </div>
        <form class="nav-upload" action="/inspect" method="post" enctype="multipart/form-data">
          <input
            id="nav-upload-input"
            class="nav-upload-input"
            type="file"
            name="upload"
            accept=".dxf"
            required
          />
          <label class="button" for="nav-upload-input">CHOOSE DXF</label>
          <span class="nav-upload-name" id="nav-upload-name">NO FILE SELECTED</span>
          <button type="submit" class="button button-primary">INSPECT DXF</button>
        </form>
      </nav>

      <main class="workspace">
        {% block content %}{% endblock %}
      </main>
    </div>

    <script>
      const statusClock = document.getElementById("status-clock");
      function refreshClock() {
        if (!statusClock) return;
        const stamp = new Date();
        statusClock.textContent = stamp.toLocaleString("en-US", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
      }
      refreshClock();
      setInterval(refreshClock, 1000);

      const navUploadInput = document.getElementById("nav-upload-input");
      const navUploadName = document.getElementById("nav-upload-name");
      if (navUploadInput && navUploadName) {
        navUploadInput.addEventListener("change", () => {
          const file = navUploadInput.files && navUploadInput.files[0];
          navUploadName.textContent = file ? file.name : "NO FILE SELECTED";
        });
      }
    </script>
  </body>
</html>
